<!-- The Iconify web component used to be loaded here for the gallery cards and
     sidebar. Both now render artwork baked in at sync time (see
     assets/js/sidebar-icons.js), so nothing on the site constructs an
     <iconify-icon> any more and the CDN script — render-blocking, third-party,
     on every page — was removed. Iconify is still where the artwork comes
     from; scripts/sync_notes.py just fetches it once at build instead. -->

<!-- Bootstrap Icons webfont, fetched up front. Every `bi` glyph on the site --
     the navbar's GitHub mark, the sidebar's collapse chevrons and "back to
     Notes" arrow, code-block copy buttons -- is a character in this font, and
     it ships `font-display: block`, meaning those glyphs render as *nothing*
     until it arrives. The browser only discovers it midway through parsing
     bootstrap-icons.css, so it starts ~200ms in and the icons blink into
     existence afterwards. Preloading moves the fetch to the head of the queue.

     The `?hash` must match the one in site_libs/bootstrap/bootstrap-icons.css
     or the browser fetches the font twice; re-check it after a Quarto upgrade
     (a "preloaded but not used" console warning is the tell). -->
<link rel="preload" as="font" type="font/woff" crossorigin
      href="/site_libs/bootstrap/bootstrap-icons.woff?e34853135f9e39acf64315236852cd5a">

<!-- Sidebar icon artwork, baked in by scripts/sync_notes.py and injected by
     custom_body.html. Deliberately a blocking <script> in the head rather than
     inline or deferred: the sidebar is above the fold, so the map has to exist
     before the injector runs (and before first paint) or the icons pop in late
     and shove every label sideways. One file, fetched and HTTP-cached once,
     instead of ~35KB repeated in every rendered page. -->
<script src="/assets/js/sidebar-icons.js"></script>

<!-- Analytics -- production host only.

     The tag is gated on the hostname because `make preview` serves the very
     same rendered pages from localhost, and an ungated tag counts every dev
     session as a real visit. The check is deliberately at run time rather than
     build time: CI publishes the identical `_site/` output that gets built
     locally, so a build-time flag would require the two builds to differ. One
     artifact, correct in both places.

     SCOPE -- this excludes *dev* traffic only. Browsing the live site from my
     own phone or laptop still registers, since the hostname matches there.
     Accepted deliberately: that reads as one returning user rather than as
     inflated traffic, so the reports still answer "does anyone else read this".

     A GTM container (GTM-5J63Z9M7) used to load alongside this. Its published
     config -- readable at googletagmanager.com/gtm.js?id=GTM-5J63Z9M7 -- held
     zero tags and zero triggers, so it shipped 116KB gzipped on every pageview
     to run nothing. Removed. If tag-management without a redeploy is ever
     wanted, paste the snippet back from the GTM console. -->
<script>
  (function () {
    if (location.hostname !== 'betopark97.github.io') return;

    // Google tag (gtag.js). `gtag` is assigned onto window rather than declared
    // as a bare `function gtag()`: a function declaration nested inside a block
    // has inconsistent scoping across engines, and GA's own code looks the
    // helper up as a global. Called back as `window.gtag` for the same reason --
    // the unqualified name only resolves because `window` happens to be the
    // global object, which is true but not worth depending on.
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };

    var tag = document.createElement('script');
    tag.async = true;
    tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-VL4M0BGJWE';
    document.head.appendChild(tag);

    window.gtag('js', new Date());
    window.gtag('config', 'G-VL4M0BGJWE');
  })();
</script>
